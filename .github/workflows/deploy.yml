name: 🚀 Deploy Backend to Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to samudra.rizalzaky.cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            echo "📁 Masuk ke direktori deploy..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "🔄 Pull latest code dari GitHub..."
            git pull origin main

            echo "🐳 Build & restart backend container..."
            cd backend
            docker compose build --no-cache samudra-backend
            docker compose up -d --force-recreate samudra-backend

            echo "🧹 Cleanup dangling images..."
            docker image prune -f

            echo "✅ Deploy selesai!"
            docker compose ps

