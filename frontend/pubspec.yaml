name: samudra
description: Aplikasi Deteksi Tsunami - Real-time earthquake monitoring and tsunami early warning system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.8.0
  retrofit: ^4.4.1

  # Local Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Location
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  # URL Launcher (kontak darurat)
  url_launcher: ^6.3.1

  # Connectivity
  connectivity_plus: ^6.1.4

  # Icons
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7

  # Auth - Kinde
  kinde_flutter_sdk: ^2.1.1

  # Environment Variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  retrofit_generator: ^9.1.9
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - .env
