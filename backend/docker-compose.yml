services:
  samudra-db:
    image: postgres:16-alpine
    container_name: samudra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-samudra_db}
      POSTGRES_USER: ${DB_USER:-samudra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - samudra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-samudra_user} -d $${POSTGRES_DB:-samudra_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  samudra-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samudra_backend
    restart: unless-stopped
    ports:
      - '0.0.0.0:3005:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: samudra-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-samudra_db}
      DB_USER: ${DB_USER:-samudra_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SYNC: ${DB_SYNC:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BMKG_API_BASE_URL: ${BMKG_API_BASE_URL:-https://data.bmkg.go.id/DataMKG/TEWS}
      BMKG_POLLING_INTERVAL_MS: ${BMKG_POLLING_INTERVAL_MS:-60000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GOOGLE_AUTH_SUCCESS_REDIRECT: ${GOOGLE_AUTH_SUCCESS_REDIRECT:-https://admin.samudra.buzz/auth/callback}
      # Cloudflare R2
      CF_R2_ACCOUNT_ID: ${CF_R2_ACCOUNT_ID}
      CF_R2_ACCESS_KEY_ID: ${CF_R2_ACCESS_KEY_ID}
      CF_R2_SECRET_ACCESS_KEY: ${CF_R2_SECRET_ACCESS_KEY}
      CF_R2_BUCKET_NAME: ${CF_R2_BUCKET_NAME:-samudra}
      CF_R2_PUBLIC_URL: ${CF_R2_PUBLIC_URL:-https://cdn.samudra.buzz}
      # Firebase FCM
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/app/firebase-service-account.json}
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      samudra-db:
        condition: service_healthy

volumes:
  samudra_pgdata:
